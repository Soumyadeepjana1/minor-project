# Single entrypoint for the whole local stack -- no Kubernetes involved.
#
#   docker compose up -d --build
#
# Brings up:
#   app          http://localhost:5000   demo Flask app
#   prometheus   http://localhost:9090   metrics + alert rules
#   alertmanager http://localhost:9093   alert routing
#   loki         http://localhost:3100   log store
#   promtail     (no port)               ships logs to Loki
#   grafana      http://localhost:3000   dashboards (embedded by the UI)
#   dashboard    http://localhost:9983   local observability UI
#
# The individual files stay independently usable, e.g. only the app + metrics:
#   docker compose -f docker-compose.dev.yaml up -d --build
#
# `docker compose up` with no -f picks this file up automatically.
#
# On hosts where the container log paths are not readable (some Docker
# Desktop / k3d setups), layer the local override on top -- `-f` merge order
# gives it override semantics that `include` does not:
#   docker compose -f compose.yaml -f docker-compose.local.yaml up -d
name: demo-platform

include:
  - docker-compose.dev.yaml
  - docker-compose.monitoring.yaml
  - docker-compose.dashboard.yaml
