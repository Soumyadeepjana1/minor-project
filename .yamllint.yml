---
extends: default

# Applies to the compose files and .github/workflows/ only (legacy manifests
# underneath k8s/ and monitoring/ are linted elsewhere and are out of scope
# here).
rules:
  line-length: disable
  document-start: disable
  comments-indentation: disable
  # GitHub Actions uses `on:` as a key; do not treat it as a boolean.
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  # Compose files are hand-formatted with inline maps like { a: 1 }.
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: whatever
    check-multi-line-strings: false
  empty-lines:
    max: 2
