name: Local stack smoke test

# Brings the real stack up with docker-compose (app, Prometheus, Alertmanager,
# Loki, Promtail, Grafana and the dashboard) and verifies it end to end with
# scripts/smoke-test.sh. No Kubernetes cluster is involved.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Compose stack + dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Generate raw configs from the manifests
        run: python scripts/extract-configs.py

      - name: Start the local stack
        run: docker compose -f compose.yaml -f docker-compose.local.yaml up -d --build

      - name: End-to-end smoke test
        run: ./scripts/smoke-test.sh --wait 120

      - name: Container status
        if: always()
        run: docker compose -f compose.yaml -f docker-compose.local.yaml ps

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f compose.yaml -f docker-compose.local.yaml logs --no-color --tail 150

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f docker-compose.local.yaml down -v
