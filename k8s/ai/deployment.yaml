apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: ai
  labels:
    app: ai-service
spec:
  # One replica on purpose: incidents and counters live in process memory.
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ai-service
          image: ai-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-service-config
          env:
            # Bearer token Alertmanager and operators must send to open
            # incidents or trigger remediation (Secret from deploy-all.sh)
            - name: API_TOKEN_FILE
              value: /var/run/secrets/ai-service-token/token
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-service-secrets
                  key: SLACK_BOT_TOKEN
                  optional: true
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-service-secrets
                  key: SLACK_SIGNING_SECRET
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: api-token
              mountPath: /var/run/secrets/ai-service-token
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: api-token
          secret:
            secretName: ai-service-token
