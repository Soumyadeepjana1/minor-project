apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Alert rules live in a separate ConfigMap mounted at /etc/prometheus/rules.
    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

    scrape_configs:
      # Scrape Prometheus itself.
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Scrape the demo app through its Service (port name "http").
      - job_name: demo-app
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [demo]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: demo-app
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      # Scrape Alertmanager's own metrics.
      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]
